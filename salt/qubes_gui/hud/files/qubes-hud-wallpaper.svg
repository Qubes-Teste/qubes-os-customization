<?xml version="1.0" encoding="UTF-8"?>
<!-- Qubes HUD managed asset. Original vector artwork; safe to edit and redistribute. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1920" height="1080" viewBox="0 0 1920 1080"
     role="img" aria-labelledby="title description">
  <title id="title">Qubes HUD technical-grid wallpaper</title>
  <desc id="description">A restrained navy technical grid with cyan framing, corner rails, and telemetry motifs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02070c"/>
      <stop offset="0.48" stop-color="#030b12"/>
      <stop offset="1" stop-color="#061622"/>
    </linearGradient>
    <radialGradient id="upper-glow" cx="86%" cy="4%" r="74%">
      <stop offset="0" stop-color="#0c7297" stop-opacity="0.18"/>
      <stop offset="0.42" stop-color="#073047" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#030b12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lower-glow" cx="7%" cy="96%" r="54%">
      <stop offset="0" stop-color="#19d3ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#19d3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="quiet-zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02080e" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#02070c" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#02080e" stop-opacity="0.28"/>
    </linearGradient>
    <pattern id="minor-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#3ccbea" stroke-width="1" stroke-opacity="0.045"/>
      <circle cx="0" cy="0" r="1.2" fill="#70e5ff" fill-opacity="0.12"/>
    </pattern>
    <pattern id="major-grid" width="240" height="240" patternUnits="userSpaceOnUse">
      <path d="M240 0H0V240" fill="none" stroke="#19d3ff" stroke-width="1" stroke-opacity="0.09"/>
    </pattern>
    <pattern id="micro-bars" width="18" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="1" fill="#55dfff" fill-opacity="0.34"/>
    </pattern>
    <filter id="soft-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#upper-glow)"/>
  <rect width="1920" height="1080" fill="url(#lower-glow)"/>
  <rect width="1920" height="1080" fill="url(#minor-grid)"/>
  <rect width="1920" height="1080" fill="url(#major-grid)"/>

  <!-- Quiet central field keeps tiled-window labels and terminal text readable. -->
  <rect x="370" y="134" width="1180" height="812" fill="url(#quiet-zone)"/>

  <!-- Long architectural rails. -->
  <g fill="none" stroke="#19d3ff" stroke-linecap="square">
    <path d="M0 80H238l18 18h358" stroke-width="2" stroke-opacity="0.27"/>
    <path d="M1304 98h360l18-18h238" stroke-width="2" stroke-opacity="0.27"/>
    <path d="M0 1020h416l16-16h234" stroke-width="2" stroke-opacity="0.20"/>
    <path d="M1254 1004h234l16 16h416" stroke-width="2" stroke-opacity="0.20"/>
    <path d="M42 0v164l18 18v282" stroke-width="2" stroke-opacity="0.22"/>
    <path d="M1878 0v164l-18 18v282" stroke-width="2" stroke-opacity="0.22"/>
    <path d="M42 1080V916l18-18V616" stroke-width="2" stroke-opacity="0.18"/>
    <path d="M1878 1080V916l-18-18V616" stroke-width="2" stroke-opacity="0.18"/>
  </g>

  <!-- Upper-left diagnostic module. -->
  <g transform="translate(76 126)" fill="none" stroke="#28d7ff">
    <path d="M0 20 20 0h262l20 20v164l-20 20H0z" stroke-width="2" stroke-opacity="0.34"/>
    <path d="M20 32h116M20 44h72M20 164h98M230 164h52" stroke-width="2" stroke-opacity="0.27"/>
    <path d="M20 72h262M20 144h262" stroke-width="1" stroke-opacity="0.13"/>
    <rect x="20" y="86" width="116" height="42" stroke-width="1" stroke-opacity="0.20"/>
    <path d="M30 116l16-12 18 5 18-18 18 13 22-8" stroke-width="2" stroke-opacity="0.40"/>
    <g fill="#5fe4ff" stroke="none" fill-opacity="0.52">
      <circle cx="238" cy="108" r="3"/><circle cx="252" cy="108" r="3"/><circle cx="266" cy="108" r="3"/>
      <rect x="152" y="86" width="80" height="3"/><rect x="152" y="98" width="54" height="3"/>
      <rect x="152" y="110" width="68" height="3"/><rect x="152" y="122" width="34" height="3"/>
    </g>
  </g>

  <!-- Upper-right stacked telemetry. -->
  <g transform="translate(1562 126)" fill="none" stroke="#29d8ff">
    <path d="M20 0h262l20 20v184H20L0 184V20z" stroke-width="2" stroke-opacity="0.30"/>
    <path d="M20 38h262M20 82h262M20 126h262M20 170h262" stroke-width="1" stroke-opacity="0.13"/>
    <g stroke-width="3" stroke-opacity="0.42">
      <path d="M34 24h84M34 68h142M34 112h104M34 156h178"/>
    </g>
    <g fill="#19d3ff" stroke="none" fill-opacity="0.42">
      <rect x="228" y="21" width="42" height="5"/><rect x="228" y="65" width="28" height="5"/>
      <rect x="228" y="109" width="36" height="5"/><rect x="228" y="153" width="50" height="5"/>
    </g>
  </g>

  <!-- Side rails and machine-readable-looking marks without semantic text. -->
  <g fill="#35d9ff">
    <rect x="77" y="390" width="8" height="294" fill-opacity="0.13"/>
    <rect x="94" y="390" width="4" height="294" fill-opacity="0.28"/>
    <rect x="112" y="390" width="144" height="294" fill="url(#micro-bars)"/>
    <rect x="1835" y="390" width="8" height="294" fill-opacity="0.13"/>
    <rect x="1822" y="390" width="4" height="294" fill-opacity="0.28"/>
    <rect x="1664" y="390" width="144" height="294" fill="url(#micro-bars)"/>
  </g>
  <g fill="none" stroke="#19d3ff" stroke-width="1">
    <path d="M76 370h194l18 18v308l-18 18H76" stroke-opacity="0.22"/>
    <path d="M1844 370h-194l-18 18v308l18 18h194" stroke-opacity="0.22"/>
    <path d="M104 410h164M104 666h164M1816 410h-164M1816 666h-164" stroke-opacity="0.27"/>
  </g>

  <!-- Subtle central registration target. -->
  <g transform="translate(960 540)" fill="none" stroke="#46dcfb">
    <circle r="106" stroke-width="1" stroke-opacity="0.045"/>
    <circle r="72" stroke-width="1" stroke-dasharray="2 13" stroke-opacity="0.10"/>
    <path d="M-142 0h54M88 0h54M0-142v54M0 88v54" stroke-width="1" stroke-opacity="0.11"/>
    <path d="M-10 0H10M0-10V10" stroke-width="1" stroke-opacity="0.14"/>
  </g>

  <!-- Lower edge signal plots. -->
  <g transform="translate(76 818)" fill="none" stroke="#27d7ff">
    <path d="M0 20 20 0h282l20 20v118l-20 20H0z" stroke-width="2" stroke-opacity="0.26"/>
    <path d="M20 126h282M20 30h282" stroke-width="1" stroke-opacity="0.13"/>
    <path d="M20 108l18-4 20-30 18 24 20-8 18-42 20 51 18-22 20 12 18-28 20 41 18-14 20 3 18-34 20 46 20-8" stroke-width="2" stroke-opacity="0.46"/>
  </g>
  <g transform="translate(1522 818)" fill="none" stroke="#27d7ff">
    <path d="M20 0h282l20 20v118l-20 20H20L0 138V20z" stroke-width="2" stroke-opacity="0.26"/>
    <path d="M20 38h282M20 70h282M20 102h282" stroke-width="1" stroke-opacity="0.13"/>
    <g fill="#53e0ff" stroke="none">
      <rect x="24" y="18" width="118" height="4" fill-opacity="0.34"/>
      <rect x="24" y="50" width="214" height="4" fill-opacity="0.28"/>
      <rect x="24" y="82" width="164" height="4" fill-opacity="0.32"/>
      <rect x="24" y="114" width="248" height="4" fill-opacity="0.24"/>
    </g>
  </g>

  <!-- Sparse luminous anchors. -->
  <g fill="#55e2ff">
    <circle cx="42" cy="540" r="8" fill-opacity="0.08" filter="url(#soft-cyan)"/>
    <circle cx="42" cy="540" r="2" fill-opacity="0.60"/>
    <circle cx="1878" cy="540" r="8" fill-opacity="0.08" filter="url(#soft-cyan)"/>
    <circle cx="1878" cy="540" r="2" fill-opacity="0.60"/>
    <circle cx="960" cy="80" r="2" fill-opacity="0.44"/>
    <circle cx="960" cy="1020" r="2" fill-opacity="0.34"/>
  </g>

  <!-- Fine safe-area corner ticks. -->
  <g fill="none" stroke="#89ecff" stroke-width="2" stroke-opacity="0.30">
    <path d="M22 60V22h38M1860 22h38v38M22 1020v38h38M1860 1058h38v-38"/>
  </g>
</svg>
