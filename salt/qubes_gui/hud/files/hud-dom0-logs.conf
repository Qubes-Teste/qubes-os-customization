# Qubes HUD managed file. Owner: salt/qubes_gui/hud.
# Separate user logger; HUD_LOG_STATE holds private, session-only file offsets.
$MaxOpenFiles 512
global(workDirectory=`echo $HUD_LOG_STATE` maxMessageSize="2048"
 parser.escapeControlCharactersOnReceive="on" parser.escape8BitCharactersOnReceive="on"
 parser.escapeControlCharactersCStyle="on" processInternalMessages="on")
main_queue(queue.type="Direct")
module(load="imfile" mode="inotify")
template(name="Hud" type="string"
 string="%timegenerated:::date-rfc3339% [%$!hud_source%] %rawmsg:::escape-cc%\n")
module(load="imjournal" IgnorePreviousMessages="on" Remote="off")
input(type="imfile" File="/var/log/qubes/guid.*.log" Tag="hud"
 freshStartTail="on" reopenOnTruncate="on" PersistStateInterval="0"
 trimLineOverBytes="2048" addMetadata="on" needParse="on")
input(type="imfile" File="/var/log/qubes/qrexec.*.log" Tag="hud"
 freshStartTail="on" reopenOnTruncate="on" PersistStateInterval="0"
 trimLineOverBytes="2048" addMetadata="on" needParse="on")
input(type="imfile" File="/var/log/qubes/qubesdb.*.log" Tag="hud"
 freshStartTail="on" reopenOnTruncate="on" PersistStateInterval="0"
 trimLineOverBytes="2048" addMetadata="on" needParse="on")
input(type="imfile" File="/var/log/xen/xen-hotplug.log" Tag="hud"
 freshStartTail="on" reopenOnTruncate="on" PersistStateInterval="0"
 trimLineOverBytes="2048" addMetadata="on" needParse="on")
input(type="imfile" File="/var/log/xen/domain-builder-ng.log" Tag="hud"
 freshStartTail="on" reopenOnTruncate="on" PersistStateInterval="0"
 trimLineOverBytes="2048" addMetadata="on" needParse="on")
if $inputname == "imjournal" then {
 set $!hud_source = "journal";
 if re_match($programname, '^[A-Za-z0-9_./@-]{1,128}$') then
  set $!hud_source = "journal " & $programname;
} else if $inputname == "imfile" and re_match($!metadata!filename,
 '^/var/log/(qubes/(guid|qrexec|qubesdb)[.][A-Za-z0-9][A-Za-z0-9_.-]{0,63}[.]log|xen/(xen-hotplug|domain-builder-ng)[.]log)$') then {
 set $!hud_source = $!metadata!filename;
} else { stop }
action(type="omfile" file="/proc/self/fd/1" template="Hud" flushOnTXEnd="on")
