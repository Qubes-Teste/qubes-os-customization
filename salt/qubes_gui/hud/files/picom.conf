# Qubes HUD managed file. Owner: salt/qubes_gui/hud.
# Qubes frames and label badges stay fully opaque. Only an external cyan glow
# is added to managed frames; alpha and blur are restricted to dom0 shell UI.

backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;
detect-client-opacity = false;
unredir-if-possible = false;
transparent-clipping = false;
dbus = false;
log-level = "warn";

frame-opacity = 1.0;
corner-radius = 0;

shadow = false;
shadow-radius = 18;
shadow-opacity = 0.48;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-color = "#19d3ff";
crop-shadow-to-monitor = true;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

blur: {
    method = "dual_kawase";
    strength = 3;
};

rules = (
    {
        opacity = 1.0;
        shadow = false;
        fade = false;
        blur-background = false;
        full-shadow = false;
        clip-shadow-above = false;
        corner-radius = 0;
        unredir = false;
    },
    {
        match = "!override_redirect && !fullscreen && window_type != 'dock' && "
                "(window_type = 'normal' || window_type = 'dialog' || "
                "window_type = 'utility' || _QUBES_VMNAME@)";
        opacity = 1.0;
        shadow = true;
        fade = false;
        blur-background = false;
        full-shadow = false;
        corner-radius = 0;
    },
    {
        match = "class_g = 'i3bar' && window_type = 'dock'";
        opacity = 0.94;
        shadow = true;
        fade = true;
        blur-background = true;
        full-shadow = true;
        clip-shadow-above = true;
        corner-radius = 0;
    },
    {
        match = "class_i = 'rofi' && class_g = 'Rofi'";
        opacity = 0.92;
        shadow = true;
        fade = true;
        blur-background = true;
        full-shadow = true;
        clip-shadow-above = true;
        corner-radius = 0;
    },
    {
        match = "class_i = 'Dunst' && class_g = 'Dunst' && "
                "window_type = 'notification'";
        opacity = 0.94;
        shadow = true;
        fade = true;
        blur-background = true;
        full-shadow = true;
        clip-shadow-above = true;
        corner-radius = 0;
    },
    {
        match = "_QUBES_VMNAME || _QUBES_VMNAME@ || _QUBES_LABEL || "
                "_QUBES_LABEL@ || _QUBES_LABEL_COLOR || "
                "_QUBES_LABEL_COLOR@ || class_i *= ':' || class_i@ *= ':' || "
                "class_g *= ':' || class_g@ *= ':'";
        opacity = 1.0;
        fade = false;
        blur-background = false;
        full-shadow = false;
        corner-radius = 0;
        unredir = false;
    }
);
